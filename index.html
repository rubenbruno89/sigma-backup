<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma IPTV - Backup Manager (.bd)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #121418; }
        .card { background-color: #1b1f24; border: 1px solid #2b3036; }
        .url-cell { max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<!-- Formulário Nativo Oculto: Contorna o bloqueio de CORS no temp.sh em HTML puro -->
<form id="nativeTempShForm" action="https://temp.sh/upload" method="POST" enctype="multipart/form-data" class="d-none">
    <input type="file" name="file" id="nativeTempShInput">
</form>

<div class="container py-4">
    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
        <div>
            <h3 class="mb-0 text-info"><i class="bi bi-hdd-network"></i> Sigma Backup Manager</h3>
            <small class="text-secondary">Gerenciador Standalone HTML de Clientes IPTV (.bd)</small>
        </div>
        <div>
            <span class="badge bg-secondary fs-6" id="clientCount">0 clientes</span>
        </div>
    </div>

    <div class="row g-4">
        <!-- Formulário de Cadastro -->
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header fw-bold text-light">
                    <i class="bi bi-person-plus"></i> <span id="formTitle">Adicionar Cliente</span>
                </div>
                <div class="card-body">
                    <form id="clientForm">
                        <input type="hidden" id="clientId">
                        
                        <div class="mb-3">
                            <label class="form-label form-label-sm">Nome do Cliente *</label>
                            <input type="text" id="nome" class="form-control" placeholder="Ex: João Silva" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-sm">WhatsApp (com DDD) *</label>
                            <input type="tel" id="whatsapp" class="form-control" placeholder="Ex: 5511999999999" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-sm">Data de Vencimento *</label>
                            <input type="date" id="vencimento" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-sm">URL / Dados do Cliente (Sigma / M3U / Xtream) *</label>
                            <textarea id="urlDados" class="form-control" rows="3" placeholder="http://servidor.com:80/get.php?username=..." required></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-info fw-bold">
                                <i class="bi bi-save"></i> Salvar na Lista
                            </button>
                            <button type="button" id="btnCancelEdit" class="btn btn-outline-secondary d-none" onclick="resetForm()">
                                Cancelar Edição
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Painel de Backup e Lista -->
        <div class="col-lg-8">
            <!-- Barra de Ferramentas de Backup (.bd) -->
            <div class="card shadow-sm mb-4 border-info border-opacity-25">
                <div class="card-header fw-bold text-info d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-cloud-arrow-up"></i> Central de Backup & Transporte Rápido (.bd)</span>
                    <small class="text-secondary fw-normal">100% Client-Side</small>
                </div>
                <div class="card-body">
                    <div class="row g-2">
                        <!-- Download Local -->
                        <div class="col-md-6 col-lg-3">
                            <button onclick="downloadLocalBD()" class="btn btn-success w-100 h-100">
                                <i class="bi bi-download"></i> Baixar <b>.bd</b> Local
                            </button>
                        </div>

                        <!-- Upload temp.sh (Bypass Nativo HTML Form) -->
                        <div class="col-md-6 col-lg-3">
                            <button onclick="uploadTempShNative()" id="btnTempSh" class="btn btn-primary w-100 h-100" title="Envia direto sem erro de CORS via Form Nativo">
                                <i class="bi bi-rocket-takeoff"></i> Enviar temp.sh
                            </button>
                        </div>

                        <!-- Upload Alternativo (TmpFiles / File.io) -->
                        <div class="col-md-6 col-lg-3">
                            <button onclick="uploadAlternative()" id="btnAlt" class="btn btn-warning text-dark fw-semibold w-100 h-100" title="Gera link direto na tela">
                                <i class="bi bi-lightning-charge-fill"></i> Alt Rápido (API)
                            </button>
                        </div>

                        <!-- Importar .bd -->
                        <div class="col-md-6 col-lg-3">
                            <label class="btn btn-outline-light w-100 h-100 d-flex align-items-center justify-content-center m-0" style="cursor: pointer;">
                                <span><i class="bi bi-folder2-open"></i> Importar .bd</span>
                                <input type="file" id="importFile" accept=".bd,.json" class="d-none" onchange="importLocalBD(event)">
                            </label>
                        </div>
                    </div>

                    <!-- Resultado do Upload (Link Rápido) -->
                    <div id="uploadResult" class="mt-3 d-none">
                        <div class="alert alert-dark border-info mb-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <div class="text-truncate" style="max-width: 75%;">
                                <small class="text-info d-block fw-bold" id="uploadProviderName">Link gerado:</small>
                                <a href="#" target="_blank" id="generatedLink" class="text-light text-decoration-underline fw-semibold"></a>
                            </div>
                            <button class="btn btn-sm btn-info fw-semibold" onclick="copyGeneratedLink()">
                                <i class="bi bi-clipboard"></i> Copiar Link
                            </button>
                        </div>
                    </div>

                    <!-- Alerta de Erro/Status -->
                    <div id="statusAlert" class="alert mt-3 mb-0 d-none" role="alert"></div>
                </div>
            </div>

            <!-- Tabela de Clientes -->
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span class="fw-bold"><i class="bi bi-people"></i> Clientes no Banco Atual</span>
                    <div class="d-flex gap-2">
                        <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Buscar cliente..." onkeyup="renderTable()">
                        <button class="btn btn-sm btn-outline-danger" onclick="clearAll()" title="Limpar todo o banco">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead class="table-active">
                            <tr>
                                <th>Nome</th>
                                <th>WhatsApp</th>
                                <th>Vencimento</th>
                                <th>URL / Dados</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="clientTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Banco local persistente no navegador
    let clients = JSON.parse(localStorage.getItem('sigma_backup_db')) || [];

    document.addEventListener('DOMContentLoaded', renderTable);

    function saveState() {
        localStorage.setItem('sigma_backup_db', JSON.stringify(clients));
        renderTable();
    }

    // Cadastro e Edição
    document.getElementById('clientForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const id = document.getElementById('clientId').value;
        const nome = document.getElementById('nome').value.trim();
        const whatsapp = document.getElementById('whatsapp').value.replace(/\D/g, '');
        const vencimento = document.getElementById('vencimento').value;
        const urlDados = document.getElementById('urlDados').value.trim();

        if (id) {
            const index = clients.findIndex(c => c.id === id);
            if (index !== -1) {
                clients[index] = { ...clients[index], nome, whatsapp, vencimento, urlDados, updatedAt: new Date().toISOString() };
            }
        } else {
            clients.push({
                id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
                nome,
                whatsapp,
                vencimento,
                urlDados,
                createdAt: new Date().toISOString()
            });
        }

        saveState();
        resetForm();
    });

    // Renderização da Tabela
    function renderTable() {
        const tbody = document.getElementById('clientTableBody');
        const search = document.getElementById('searchInput').value.toLowerCase();
        document.getElementById('clientCount').innerText = `${clients.length} cliente(s)`;

        tbody.innerHTML = '';

        const filtered = clients.filter(c => 
            c.nome.toLowerCase().includes(search) || 
            c.whatsapp.includes(search) ||
            c.urlDados.toLowerCase().includes(search)
        );

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-secondary py-4">Nenhum cliente cadastrado ou encontrado.</td></tr>`;
            return;
        }

        filtered.forEach(c => {
            const statusBadge = getExpirationBadge(c.vencimento);
            const dataFormatada = c.vencimento.split('-').reverse().join('/');

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="fw-semibold">${escapeHTML(c.nome)}</td>
                <td>
                    <a href="https://wa.me/${c.whatsapp}" target="_blank" class="text-success text-decoration-none">
                        <i class="bi bi-whatsapp"></i> ${c.whatsapp}
                    </a>
                </td>
                <td>${dataFormatada} ${statusBadge}</td>
                <td class="url-cell" title="${escapeHTML(c.urlDados)}">
                    <button class="btn btn-sm btn-outline-secondary me-1" onclick="copyText('${escapeJS(c.urlDados)}')" title="Copiar URL">
                        <i class="bi bi-clipboard"></i>
                    </button>
                    <small class="text-secondary">${escapeHTML(c.urlDados)}</small>
                </td>
                <td class="text-end text-nowrap">
                    <button class="btn btn-sm btn-outline-info me-1" onclick="editClient('${c.id}')" title="Editar">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteClient('${c.id}')" title="Excluir">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function getExpirationBadge(dateStr) {
        const today = new Date();
        today.setHours(0,0,0,0);
        const expDate = new Date(dateStr + "T00:00:00");
        const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));

        if (diffDays < 0) return `<span class="badge bg-danger">Vencido</span>`;
        if (diffDays <= 3) return `<span class="badge bg-warning text-dark">Vence em ${diffDays}d</span>`;
        return `<span class="badge bg-success">Ativo</span>`;
    }

    function editClient(id) {
        const client = clients.find(c => c.id === id);
        if (!client) return;

        document.getElementById('clientId').value = client.id;
        document.getElementById('nome').value = client.nome;
        document.getElementById('whatsapp').value = client.whatsapp;
        document.getElementById('vencimento').value = client.vencimento;
        document.getElementById('urlDados').value = client.urlDados;

        document.getElementById('formTitle').innerText = 'Editar Cliente';
        document.getElementById('btnCancelEdit').classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteClient(id) {
        if (confirm('Deseja realmente remover este cliente da lista?')) {
            clients = clients.filter(c => c.id !== id);
            saveState();
        }
    }

    function clearAll() {
        if (clients.length === 0) return;
        if (confirm('ATENÇÃO: Isso apagará todos os clientes da tela atual. Faça backup antes! Continuar?')) {
            clients = [];
            saveState();
        }
    }

    function resetForm() {
        document.getElementById('clientForm').reset();
        document.getElementById('clientId').value = '';
        document.getElementById('formTitle').innerText = 'Adicionar Cliente';
        document.getElementById('btnCancelEdit').classList.add('d-none');
    }

    // =========================================================================
    // GERAÇÃO, DOWNLOAD LOCAL E IMPORTAÇÃO DO ARQUIVO .BD
    // =========================================================================

    function generateBDBlob() {
        const backupPayload = {
            app: "SigmaBackupManager",
            version: "1.1",
            exportedAt: new Date().toISOString(),
            totalClients: clients.length,
            data: clients
        };
        return new Blob([JSON.stringify(backupPayload, null, 2)], { type: 'application/octet-stream' });
    }

    function getFileName() {
        const date = new Date().toISOString().slice(0, 10);
        return `sigma_backup_${date}.bd`;
    }

    function downloadLocalBD() {
        if (clients.length === 0) return showStatus('Adicione pelo menos 1 cliente antes de gerar o backup.', 'warning');

        const blob = generateBDBlob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = getFileName();
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showStatus('Arquivo <b>.bd</b> salvo localmente com sucesso!', 'success');
    }

    function importLocalBD(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                const importedClients = Array.isArray(parsed) ? parsed : parsed.data;

                if (!Array.isArray(importedClients)) throw new Error('Formato inválido');

                if (clients.length > 0) {
                    const merge = confirm('Você já possui clientes na tela.\nClique em OK para MESCLAR ou CANCELAR para SUBSTITUIR tudo.');
                    if (merge) {
                        const existingIds = new Set(clients.map(c => c.id));
                        importedClients.forEach(ic => {
                            if (!existingIds.has(ic.id)) clients.push(ic);
                        });
                    } else {
                        clients = importedClients;
                    }
                } else {
                    clients = importedClients;
                }

                saveState();
                showStatus(`Backup restaurado com sucesso! (${importedClients.length} clientes carregados)`, 'success');
            } catch (err) {
                showStatus('Erro ao ler o arquivo .bd. Verifique se é um backup válido.', 'danger');
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    // =========================================================================
    // TRANSPORTE RÁPIDO 100% HTML PURO (SEM SERVIDOR / SEM ERRO DE CORS)
    // =========================================================================

    /**
     * OPÇÃO 1: Envio nativo para temp.sh usando DataTransfer + HTML Form POST.
     */
    function uploadTempShNative() {
        if (clients.length === 0) {
            return showStatus('Lista vazia! Adicione clientes antes de enviar para o temp.sh.', 'warning');
        }

        hideMessages();

        try {
            const blob = generateBDBlob();
            const fileName = getFileName();
            const file = new File([blob], fileName, { type: 'application/octet-stream' });

            // Injeta o arquivo .bd gerado dentro do <input type="file"> oculto
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            document.getElementById('nativeTempShInput').files = dataTransfer.files;

            // Abre mini-janela centralizada para exibir o link retornado pelo temp.sh
            const w = 580, h = 220;
            const left = Math.max(0, (window.screen.width - w) / 2);
            const top = Math.max(0, (window.screen.height - h) / 2);

            const popup = window.open(
                '',
                'TempShUploadWin',
                `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`
            );

            const form = document.getElementById('nativeTempShForm');

            if (popup) {
                popup.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head><title>Enviando para temp.sh...</title></head>
                    <body style="background:#121418;color:#0dcaf0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:85vh;margin:0;text-align:center;">
                        <div style="font-size:18px;font-weight:bold;margin-bottom:8px;">🚀 Enviando ${fileName} para temp.sh...</div>
                        <small style="color:#adb5bd;">Aguarde um instante, o link direto aparecerá aqui.</small>
                    </body>
                    </html>
                `);
                popup.document.close();
                form.target = 'TempShUploadWin';
            } else {
                form.target = '_blank';
            }

            form.submit();

            showStatus(
                '<b><i class="bi bi-rocket-takeoff"></i> Arquivo enviado diretamente ao temp.sh!</b><br>' +
                'Copie (<code>Ctrl+C</code>) o link gerado na janela que se abriu.',
                'info'
            );
        } catch (error) {
            console.error(error);
            showStatus('Não foi possível preparar o formulário nativo. Use o botão amarelo "Alt Rápido (API)".', 'danger');
        }
    }

    /**
     * OPÇÃO 2 (ALTERNATIVA): APIs com CORS liberado nativamente no navegador.
     * Tenta TmpFiles.org e possui fallback automático para File.io.
     */
    async function uploadAlternative() {
        if (clients.length === 0) {
            return showStatus('Lista vazia! Adicione clientes antes de enviar.', 'warning');
        }

        const btn = document.getElementById('btnAlt');
        setLoading(btn, true, 'Gerando...');
        hideMessages();

        const blob = generateBDBlob();
        const fileName = getFileName();

        try {
            // Tentativa 1: TmpFiles.org
            const formData = new FormData();
            formData.append('file', blob, fileName);

            const response = await fetch('https://tmpfiles.org/api/v1/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.status === 'success' && result.data && result.data.url) {
                const directDownloadUrl = result.data.url
                    .replace(/^http:\/\//i, 'https://')
                    .replace('tmpfiles.org/', 'tmpfiles.org/dl/');

                showUploadLink('TmpFiles.org (Download Direto - Expira em 60 min)', directDownloadUrl);
                return;
            }
            throw new Error('TmpFiles indisponível');
        } catch (err1) {
            console.warn('TmpFiles falhou, acionando fallback File.io...', err1);

            // Tentativa 2 (Fallback automático): File.io
            try {
                const formData2 = new FormData();
                formData2.append('file', blob, fileName);

                const res2 = await fetch('https://file.io/', {
                    method: 'POST',
                    body: formData2
                });

                const result2 = await res2.json();
                if (result2.success && result2.link) {
                    showUploadLink('File.io (Fallback Automático - Expira após 1º download)', result2.link);
                    return;
                }
                throw new Error('Fallback File.io também falhou');
            } catch (err2) {
                console.error(err2);
                showStatus('Erro de conexão nas APIs alternativas. Verifique sua internet ou baixe o .bd local.', 'danger');
            }
        } finally {
            setLoading(btn, false, '<i class="bi bi-lightning-charge-fill"></i> Alt Rápido (API)');
        }
    }

    // =========================================================================
    // HELPERS DE UI E SEGURANÇA
    // =========================================================================

    function showUploadLink(provider, url) {
        const box = document.getElementById('uploadResult');
        const linkEl = document.getElementById('generatedLink');
        document.getElementById('uploadProviderName').innerText = `Transporte Rápido via ${provider}:`;
        
        linkEl.href = url;
        linkEl.innerText = url;
        box.classList.remove('d-none');
    }

    function showStatus(msg, type = 'info') {
        const alertEl = document.getElementById('statusAlert');
        alertEl.className = `alert alert-${type} mt-3 mb-0`;
        alertEl.innerHTML = msg;
        alertEl.classList.remove('d-none');
    }

    function hideMessages() {
        document.getElementById('uploadResult').classList.add('d-none');
        document.getElementById('statusAlert').classList.add('d-none');
    }

    function setLoading(btn, isLoading, htmlText) {
        btn.disabled = isLoading;
        btn.innerHTML = isLoading ? `<span class="spinner-border spinner-border-sm"></span> ${htmlText}` : htmlText;
    }

    function copyGeneratedLink() {
        copyText(document.getElementById('generatedLink').innerText);
    }

    function copyText(text) {
        navigator.clipboard.writeText(text).then(() => {
            showStatus('<i class="bi bi-check2-all"></i> Copiado para a área de transferência!', 'success');
            setTimeout(() => document.getElementById('statusAlert').classList.add('d-none'), 2500);
        });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    }

    function escapeJS(str) {
        return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
    }
</script>
</body>
</html>
